<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Greeting</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="greeting">Hello</h1>
  </header>

  <main>
    <div class="boxes">
      <div class="box" data-color="red">Red</div>
      <div class="box" data-color="blue">Blue</div>
      <div class="box" data-color="green">Green</div>
      <div class="box" data-color="yellow">Yellow</div>
    </div>

    <div class="greet-area">
      <input type="text" id="nameInput" placeholder="Enter your name">
      <button id="greetBtn">Greet</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
