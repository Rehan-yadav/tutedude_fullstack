<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laundry Mart - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- Left Section: Illustration -->
    <div class="left-section">
      <img src="https://images.unsplash.com/photo-1517677208171-0bc6725a3e60?auto=format&fit=crop&w=900&q=80%22" alt="Washing machine illustration">
    </div>

    <!-- Right Section: Login Form -->
    <div class="form-section">
      <div class="form-box">
        <h1>Hello Again!</h1>
        <p class="subtitle">Welcome back! we missed you!</p>

        <form>
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Emailid@site.com">

          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Password">

          <a href="#" class="forgot">Forgot Password</a>

          <button type="submit">Login</button>
        </form>

        <p class="register">Not a member? <a href="#">Register Now</a></p>
      </div>
    </div>

  </div>

</body>
</html>
