<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compound Interest Calculation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Compound Interest Calculation</h1>

    <div class="values">
      <p>Principal (P): <span id="principal"></span></p>
      <p>Rate (r): <span id="rate"></span></p>
      <p>Compounded per year (n): <span id="n"></span></p>
      <p>Time (t): <span id="time"></span> years</p>
    </div>

    <p class="formula">A = P(1 + r/n)<sup>nt</sup></p>

    <p class="result" id="result"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
